name: board-cafe-kiosk

# DB 인프라만 실행한다. Spring Boot의 compose 프로필에서 Flyway가 스키마/기준정보를 설치한다.
# 실행: docker compose --env-file .env.compose up -d --wait
services:
  mariadb:
    image: mariadb:12.2.2
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: board_cafe_kiosk_2603
      MARIADB_USER: ${COMPOSE_MARIADB_USERNAME:?Set COMPOSE_MARIADB_USERNAME in .env.compose}
      MARIADB_PASSWORD: ${COMPOSE_MARIADB_PASSWORD:?Set COMPOSE_MARIADB_PASSWORD in .env.compose}
      MARIADB_ROOT_PASSWORD: ${COMPOSE_MARIADB_ROOT_PASSWORD:?Set COMPOSE_MARIADB_ROOT_PASSWORD in .env.compose}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    ports:
      - "127.0.0.1:${COMPOSE_MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s

  pgvector:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: board_cafe_kiosk_2603
      POSTGRES_USER: ${COMPOSE_PGVECTOR_USERNAME:?Set COMPOSE_PGVECTOR_USERNAME in .env.compose}
      POSTGRES_PASSWORD: ${COMPOSE_PGVECTOR_PASSWORD:?Set COMPOSE_PGVECTOR_PASSWORD in .env.compose}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "timezone=Asia/Seoul", "-c", "log_timezone=Asia/Seoul"]
    ports:
      - "127.0.0.1:${COMPOSE_PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s

volumes:
  mariadb-data:
  pgvector-data:
