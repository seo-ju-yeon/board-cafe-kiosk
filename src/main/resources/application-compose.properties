# IntelliJ Active profiles: compose
# Credentials/ports must match the file passed to docker compose --env-file.
# The base application's .env still supplies OpenAI, mail, payment and other settings.
spring.config.import=file:.env.compose[.properties]

spring.datasource.mariadb.url=jdbc:mariadb://localhost:${COMPOSE_MARIADB_PORT:3307}/board_cafe_kiosk_2603
spring.datasource.mariadb.username=${COMPOSE_MARIADB_USERNAME}
spring.datasource.mariadb.password=${COMPOSE_MARIADB_PASSWORD}

spring.datasource.pgvector.url=jdbc:postgresql://localhost:${COMPOSE_PGVECTOR_PORT:5433}/board_cafe_kiosk_2603
spring.datasource.pgvector.username=${COMPOSE_PGVECTOR_USERNAME}
spring.datasource.pgvector.password=${COMPOSE_PGVECTOR_PASSWORD}

# 새 Compose DB에만 자동 마이그레이션을 적용한다.
app.database.migrations.enabled=true
spring.batch.jdbc.initialize-schema=never
