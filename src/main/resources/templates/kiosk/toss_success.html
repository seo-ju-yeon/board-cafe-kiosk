<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- 결제 완료 화면 head 설정 -->
    <meta charset="UTF-8">
    <title>결제 완료 - Board Game Cafe</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/kiosk/toss_success.css}">
</head>
<body>
<!-- Toss Payments 결제 완료 안내 -->
<div class="container">
    <i data-lucide="circle-check-big" class="check-icon"></i>
    <h1>결제 완료!</h1>

    <!-- 최종 결제 금액 -->
    <div class="amount"
         th:text="'₩' + ${#numbers.formatInteger(finalAmount, 1, 'COMMA')}">₩0
    </div>

    <!-- 결제 완료 후 적립 포인트 -->
    <div class="point-badge"
         th:if="${earnedPoints != null and earnedPoints > 0}"
         th:with="pointText=${earnedPoints + 'P 적립 완료!'}">
        <i data-lucide="gift"></i>
        <span th:text="${pointText}">0P 적립 완료!</span>
    </div>

    <p class="order-no" th:text="'주문번호: #' + ${orderId}">주문번호: #0</p>
    <p class="thanks">이용해주셔서 감사합니다.</p>

    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>
    <p class="redirect-msg">3초 후 메인 화면으로 이동합니다...</p>
</div>

<!-- 결제 완료 후 자동 이동 경로 -->
<script th:inline="javascript">
    const redirectUrl = /*[[${redirectUrl}]]*/ '/kiosk/session/start';
</script>

<!-- 결제 완료 화면 스크립트 -->
<script th:src="@{/js/kiosk/toss_success.js}"></script>
</body>
</html>
